<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GT HOTELS - Premium Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --bg-elevated: #12121a;
            --fg: #f4f4f5;
            --fg-muted: #71717a;
            --accent: #d4a853;
            --accent-hover: #e8be6a;
            --card: #16161f;
            --border: #27272a;
            --success: #22c55e;
            --error: #ef4444;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; overflow-x: hidden; }
        .font-display { font-family: 'Space Grotesk', sans-serif; }
        
        /* Background atmosphere */
        .bg-atmosphere {
            position: fixed; inset: 0; pointer-events: none; z-index: -1;
            background: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(212, 168, 83, 0.15), transparent),
                radial-gradient(ellipse 60% 40% at 80% 50%, rgba(212, 168, 83, 0.08), transparent),
                var(--bg);
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        
        /* Animations */
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .animate-slide-up { animation: slideUp 0.5s ease-out forwards; }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
        .animate-scale-in { animation: scaleIn 0.3s ease-out forwards; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        
        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }
        
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
        
        /* Form Styles */
        .input-field {
            background: var(--card); border: 1px solid var(--border); color: var(--fg);
            padding: 12px 16px; border-radius: 8px; width: 100%; transition: all 0.2s ease; font-size: 14px;
        }
        .input-field:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(212, 168, 83, 0.15); }
        .input-field::placeholder { color: var(--fg-muted); }
        
        .btn-primary {
            background: var(--accent); color: var(--bg); font-weight: 600; padding: 12px 24px;
            border-radius: 8px; border: none; cursor: pointer; transition: all 0.2s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-1px); box-shadow: 0 4px 20px rgba(212, 168, 83, 0.3); }
        
        .btn-secondary {
            background: var(--card); color: var(--fg); border: 1px solid var(--border);
            padding: 12px 24px; border-radius: 8px; cursor: pointer; transition: all 0.2s ease; font-weight: 500;
        }
        .btn-secondary:hover { background: #1c1c28; border-color: var(--fg-muted); }
        
        /* Cards */
        .hotel-card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            overflow: hidden; transition: all 0.3s ease; cursor: pointer;
        }
        .hotel-card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        .hotel-card:hover .hotel-image { transform: scale(1.05); }
        .hotel-image { transition: transform 0.5s ease; }
        
        /* Rating Badge */
        .rating-badge { background: #166534; color: white; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        
        /* Modals */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px);
            z-index: 50; display: flex; align-items: flex-end; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--bg-elevated); border-radius: 24px 24px 0 0; width: 100%; max-height: 90vh;
            overflow-y: auto; transform: translateY(100%); transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        @media (min-width: 768px) {
            .modal-content { max-width: 600px; max-height: 85vh; border-radius: 24px; margin: auto; }
        }
        
        /* Page Container */
        .page { display: none; min-height: 100vh; padding-bottom: 100px; }
        .page.active { display: block; }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-elevated);
            border-top: 1px solid var(--border); padding: 8px 0; z-index: 40; display: flex; justify-content: space-around;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--fg-muted); text-decoration: none; font-size: 10px; padding: 8px 16px; transition: color 0.2s; background: none; border: none; cursor: pointer; }
        .nav-item.active { color: var(--accent); }
        .nav-item:hover { color: var(--fg); }
        
        /* Search Container */
        .search-container { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); padding: 40px 20px; border-radius: 0 0 32px 32px; }
        
        /* Status Badge */
        .status-confirmed { background: rgba(34, 197, 94, 0.2); color: #22c55e; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        
        /* Toast */
        .toast { position: fixed; top: 20px; right: 20px; padding: 16px 24px; border-radius: 12px; z-index: 100; animation: slideUp 0.3s ease; }
        .toast-success { background: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #22c55e; }
        .toast-error { background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; }
        
        /* Amenity Pill */
        .amenity-pill { background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 20px; font-size: 12px; color: var(--fg-muted); display: inline-flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>
    <div class="bg-atmosphere"></div>
    <div id="toastContainer"></div>

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-[var(--bg-elevated)] border-b border-[var(--border)]">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="#" onclick="navigateTo('home')" class="font-display text-2xl font-bold tracking-tight text-[var(--accent)]">GT HOTELS</a>
            <div class="flex items-center gap-4">
                <span id="headerUserName" class="text-sm text-[var(--fg-muted)] hidden sm:block"></span>
                <button onclick="navigateTo('account')" class="flex items-center gap-2 text-[var(--fg-muted)] hover:text-[var(--fg)] transition-colors bg-transparent border-none cursor-pointer">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <span class="hidden sm:inline text-sm">Account</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- HOME PAGE -->
        <div id="page-home" class="page active">
            <div class="search-container">
                <div class="max-w-4xl mx-auto">
                    <h1 class="font-display text-3xl sm:text-4xl font-bold mb-2 animate-slide-up">Find Your Perfect Stay</h1>
                    <p class="text-[var(--fg-muted)] mb-6 animate-slide-up stagger-1">Discover handpicked hotels across India</p>
                    
                    <div class="bg-[var(--bg)] rounded-2xl p-4 border border-[var(--border)] animate-slide-up stagger-2">
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div class="relative">
                                <label class="block text-[10px] uppercase tracking-wider text-[var(--fg-muted)] mb-2">Location</label>
                                <div class="relative">
                                    <i data-lucide="map-pin" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[var(--fg-muted)]"></i>
                                    <input type="text" id="searchLocation" class="input-field pl-10" placeholder="City or Hotel" autocomplete="off">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase tracking-wider text-[var(--fg-muted)] mb-2">Check-in</label>
                                <div class="relative">
                                    <i data-lucide="calendar" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[var(--fg-muted)]"></i>
                                    <input type="date" id="checkIn" class="input-field pl-10">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase tracking-wider text-[var(--fg-muted)] mb-2">Check-out</label>
                                <div class="relative">
                                    <i data-lucide="calendar" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[var(--fg-muted)]"></i>
                                    <input type="date" id="checkOut" class="input-field pl-10">
                                </div>
                            </div>
                            <div>
                                <label class="block text-[10px] uppercase tracking-wider text-[var(--fg-muted)] mb-2">Guests</label>
                                <div class="relative">
                                    <i data-lucide="users" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-[var(--fg-muted)]"></i>
                                    <select id="guests" class="input-field pl-10 appearance-none">
                                        <option value="1">1 Guest</option>
                                        <option value="2" selected>2 Guests</option>
                                        <option value="4">4 Guests</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button onclick="performSearch()" class="btn-primary w-full mt-4">
                            <i data-lucide="search" class="w-4 h-4"></i> Search Hotels
                        </button>
                    </div>
                </div>
            </div>
            
            <div class="max-w-7xl mx-auto px-4 py-8">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="font-display text-xl font-semibold">Featured Hotels</h2>
                    <span id="hotelCount" class="text-sm text-[var(--fg-muted)]"></span>
                </div>
                <div id="hotelsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                <div id="noResults" class="hidden text-center py-16">
                    <i data-lucide="search-x" class="w-16 h-16 text-[var(--fg-muted)] mx-auto mb-4"></i>
                    <h3 class="font-display text-xl font-semibold mb-2">No hotels found</h3>
                    <p class="text-[var(--fg-muted)]">Try adjusting your search criteria</p>
                </div>
            </div>
        </div>

        <!-- BOOKINGS PAGE -->
        <div id="page-bookings" class="page">
            <div class="max-w-3xl mx-auto px-4 py-8">
                <h1 class="font-display text-2xl font-bold mb-6">My Bookings</h1>
                <div id="bookingsContent"></div>
            </div>
        </div>

        <!-- ACCOUNT PAGE -->
        <div id="page-account" class="page">
            <div class="max-w-md mx-auto px-4 py-8" id="accountContent"></div>
        </div>

        <!-- ADMIN PAGE -->
        <div id="page-admin" class="page">
            <div class="max-w-6xl mx-auto px-4 py-8" id="adminContent"></div>
        </div>

        <!-- SUCCESS PAGE -->
        <div id="page-success" class="page">
            <div class="min-h-[80vh] flex items-center justify-center px-4">
                <div class="text-center max-w-md animate-scale-in">
                    <div class="w-24 h-24 bg-[rgba(34,197,94,0.2)] rounded-full flex items-center justify-center mx-auto mb-6 animate-float">
                        <i data-lucide="check-circle-2" class="w-12 h-12 text-[var(--success)]"></i>
                    </div>
                    <h1 class="font-display text-3xl font-bold mb-2">Booking Confirmed!</h1>
                    <p class="text-[var(--fg-muted)] mb-6">Your hotel has been booked successfully.</p>
                    <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 mb-8">
                        <span class="text-sm text-[var(--fg-muted)]">Order ID</span>
                        <div id="successOrderId" class="font-display text-2xl font-bold text-[var(--accent)]"></div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-4 justify-center">
                        <button onclick="navigateTo('bookings')" class="btn-primary"><i data-lucide="receipt" class="w-4 h-4"></i> View Booking</button>
                        <button onclick="navigateTo('home')" class="btn-secondary"><i data-lucide="home" class="w-4 h-4"></i> Back to Home</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Hotel Detail Modal -->
    <div id="hotelModal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-content">
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Booking Modal -->
    <div id="bookingModal" class="modal-overlay" role="dialog" aria-modal="true">
        <div class="modal-content max-w-md">
            <div class="p-4 border-b border-[var(--border)] flex items-center justify-between sticky top-0 bg-[var(--bg-elevated)] z-10">
                <h3 class="font-display text-lg font-semibold">Complete Booking</h3>
                <button onclick="closeModal('bookingModal')" class="p-2 hover:bg-[var(--card)] rounded-lg transition-colors bg-transparent border-none">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="bookingForm" class="p-4 space-y-4">
                <input type="hidden" id="bHotelId">
                <input type="hidden" id="bTotalPrice">
                <div>
                    <label class="block text-sm text-[var(--fg-muted)] mb-2">Guest Name</label>
                    <input type="text" id="bGuestName" class="input-field" required>
                </div>
                <div>
                    <label class="block text-sm text-[var(--fg-muted)] mb-2">Mobile Number</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--fg-muted)]">+91</span>
                        <input type="tel" id="bGuestPhone" class="input-field pl-10" placeholder="9876543210" required pattern="[0-9]{10}">
                    </div>
                </div>
                <div class="bg-[var(--bg)] rounded-lg p-3">
                    <div class="flex justify-between text-sm mb-2">
                        <span class="text-[var(--fg-muted)]">Dates</span>
                        <span id="bDates"></span>
                    </div>
                    <div class="flex justify-between">
                        <span class="text-[var(--fg-muted)]">Total Amount</span>
                        <span class="font-display font-bold text-[var(--accent)]" id="bPrice"></span>
                    </div>
                </div>
                <button type="submit" class="btn-primary w-full"><i data-lucide="check-circle" class="w-4 h-4"></i> Confirm Booking</button>
            </form>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" onclick="navigateTo('home')"><i data-lucide="home" class="w-5 h-5"></i><span>Home</span></button>
        <button class="nav-item" onclick="navigateTo('bookings')"><i data-lucide="receipt" class="w-5 h-5"></i><span>Bookings</span></button>
        <button class="nav-item" onclick="navigateTo('account')"><i data-lucide="user" class="w-5 h-5"></i><span>Account</span></button>
    </nav>

<script>
    // ==========================================
    // DATABASE & STATE MANAGEMENT
    // ==========================================
    const DB = {
        get: (key) => JSON.parse(localStorage.getItem(key) || 'null'),
        set: (key, value) => localStorage.setItem(key, JSON.stringify(value)),
        init: () => {
            if (!DB.get('gt_hotels')) {
                const sampleHotels = [
                    // BANGALORE
                    {
                        id: 'h1', name: 'Hotel O Vasavi Residency', location: 'Majestic, Bangalore',
                        desc: 'A premium budget hotel located in the heart of Bangalore\'s bustling Majestic area.',
                        price: 717, origPrice: 2559, rating: 3.3, ratingCount: 89,
                        image: 'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800',
                        amenities: ['AC', 'Wifi', 'TV', 'Geyser'], lat: 12.9716, lng: 77.5946,
                        policies: ['Check-in: 12:00 PM', 'Check-out: 11:00 AM', 'Couples Welcome']
                    },
                    {
                        id: 'h2', name: 'Townhouse OAK Clove', location: 'Rajajinagar, Bangalore',
                        desc: 'An upscale boutique hotel in Rajajinagar offering modern amenities.',
                        price: 2458, origPrice: 7981, rating: 4.9, ratingCount: 444,
                        image: 'https://images.unsplash.com/photo-1582719508461-905c673771fd?w=800',
                        amenities: ['AC', 'Wifi', 'Breakfast', 'Pool'], lat: 12.9982, lng: 77.5530,
                        policies: ['Check-in: 2:00 PM', 'Check-out: 12:00 PM', 'Pets Allowed']
                    },
                    {
                        id: 'h3', name: 'Grand Imperial Suites', location: 'MG Road, Bangalore',
                        desc: 'Luxury suites in the heart of Bangalore\'s commercial district.',
                        price: 4599, origPrice: 12500, rating: 4.7, ratingCount: 312,
                        image: 'https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?w=800',
                        amenities: ['AC', 'Wifi', 'Spa', 'Gym', 'Pool'], lat: 12.9756, lng: 77.6063,
                        policies: ['Check-in: 3:00 PM', 'Complimentary Breakfast']
                    },
                    // GOA
                    {
                        id: 'h4', name: 'Sunset Bay Resort', location: 'Candolim, Goa',
                        desc: 'Beachfront resort with stunning Arabian Sea views and vibrant nightlife.',
                        price: 4299, origPrice: 8500, rating: 4.5, ratingCount: 567,
                        image: 'https://images.unsplash.com/photo-1571896349842-33c89424de2d?w=800',
                        amenities: ['AC', 'Wifi', 'Pool', 'Parking', 'Bar'], lat: 15.5139, lng: 73.7649,
                        policies: ['Beach Access', 'Room Service Available']
                    },
                    // DELHI
                    {
                        id: 'h5', name: 'The Royal Plaza', location: 'Connaught Place, Delhi',
                        desc: 'Elegant hotel in the heart of Delhi, steps away from historical landmarks.',
                        price: 5500, origPrice: 9500, rating: 4.2, ratingCount: 210,
                        image: 'https://images.unsplash.com/photo-1564501049412-61c2a3083791?w=800',
                        amenities: ['AC', 'Wifi', 'Restaurant', 'Spa'], lat: 28.6315, lng: 77.2167,
                        policies: ['Near Metro Station', 'Business Center']
                    },
                    // CHENNAI
                    {
                        id: 'h6', name: 'Marina View Inn', location: 'Marina Beach, Chennai',
                        desc: 'Wake up to the sound of waves at this charming seaside hotel.',
                        price: 3200, origPrice: 6000, rating: 4.4, ratingCount: 189,
                        image: 'https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?w=800',
                        amenities: ['AC', 'Wifi', 'Room Service', 'Sea View'], lat: 13.0500, lng: 80.2824,
                        policies: ['Close to Temple', 'Free Breakfast']
                    },
                    // UDAIPUR
                    {
                        id: 'h7', name: 'Lake Pichola Palace', location: 'Lake Pichola, Udaipur',
                        desc: 'Experience royal heritage with breathtaking views of the lake and palaces.',
                        price: 7500, origPrice: 12000, rating: 4.9, ratingCount: 320,
                        image: 'https://images.unsplash.com/photo-1596422846543-75c6fc197f07?w=800',
                        amenities: ['AC', 'Wifi', 'Pool', 'Heritage Tour'], lat: 24.5763, lng: 73.6825,
                        policies: ['Boat Ride Included', 'Cultural Show']
                    },
                    // KOLKATA
                    {
                        id: 'h8', name: 'Victoria Heritage', location: 'Park Street, Kolkata',
                        desc: 'Colonial charm meets modern luxury in the cultural capital of India.',
                        price: 3800, origPrice: 6500, rating: 4.3, ratingCount: 156,
                        image: 'https://images.unsplash.com/photo-1551882547-ff40c63fe5fa?w=800',
                        amenities: ['AC', 'Wifi', 'Library', 'Cafe'], lat: 22.5550, lng: 88.3576,
                        policies: ['Near Victoria Memorial', 'High Tea Served']
                    }
                ];
                DB.set('gt_hotels', sampleHotels);
            }
            if (!DB.get('gt_users')) DB.set('gt_users', []);
            if (!DB.get('gt_bookings')) DB.set('gt_bookings', []);
            if (!DB.get('gt_reviews')) DB.set('gt_reviews', []);
        }
    };

    // Initialize DB on load
    DB.init();

    const state = {
        user: DB.get('gt_session') || null,
        currentPage: 'home',
        searchParams: {}
    };

    // ==========================================
    // UTILITY FUNCTIONS
    // ==========================================
    function $(id) { return document.getElementById(id); }
    
    function formatPrice(num) { return new Intl.NumberFormat('en-IN').format(num); }
    
    function generateId() { return 'id_' + Math.random().toString(36).substr(2, 9); }
    
    function showToast(msg, type = 'success') {
        const el = document.createElement('div');
        el.className = `toast toast-${type}`;
        el.textContent = msg;
        $('toastContainer').appendChild(el);
        setTimeout(() => el.remove(), 4000);
    }

    function navigateTo(page) {
        // Security check for Admin
        if (page === 'admin' && (!state.user || state.user.role !== 'admin')) {
            showToast('Access Denied', 'error');
            return;
        }

        state.currentPage = page;
        
        // Hide all pages
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        
        // Show target page
        const target = $('page-' + page);
        if (target) target.classList.add('active');
        
        // Update Nav Active State
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        const navBtn = document.querySelector(`.nav-item[onclick="navigateTo('${page}')"]`);
        if (navBtn) navBtn.classList.add('active');
        
        // Special handling for pages
        if (page === 'home') renderHotels();
        if (page === 'bookings') renderBookings();
        if (page === 'account') renderAccount();
        if (page === 'admin') renderAdmin();
        
        // Toggle Bottom Nav visibility
        $('bottomNav').style.display = (page === 'admin' || page === 'success') ? 'none' : 'flex';
        
        lucide.createIcons();
        window.scrollTo(0, 0);
    }

    // ==========================================
    // RENDER FUNCTIONS
    // ==========================================
    
    function getAmenityIcon(name) {
        const map = { 'AC': 'snowflake', 'Wifi': 'wifi', 'TV': 'tv', 'Geyser': 'flame', 'Parking': 'car', 'Pool': 'waves', 'Breakfast': 'coffee', 'Gym': 'dumbbell', 'Spa': 'sparkles', 'Bar': 'wine', 'Restaurant': 'utensils' };
        return map[name] || 'check';
    }

    function renderHotels(query = '') {
        const grid = $('hotelsGrid');
        const hotels = DB.get('gt_hotels') || [];
        
        const filtered = hotels.filter(h => 
            h.name.toLowerCase().includes(query) || h.location.toLowerCase().includes(query)
        );

        if (filtered.length === 0 && query) {
            grid.innerHTML = '';
            $('noResults').classList.remove('hidden');
            $('hotelCount').textContent = '0 properties found';
            return;
        }

        $('noResults').classList.add('hidden');
        $('hotelCount').textContent = `${filtered.length} properties found`;

        grid.innerHTML = filtered.map((h, i) => {
            const discount = Math.round((h.origPrice - h.price) / h.origPrice * 100);
            return `
            <article class="hotel-card animate-slide-up stagger-${(i%4)+1}" onclick="openHotelModal('${h.id}')">
                <div class="relative h-48 overflow-hidden">
                    <img src="${h.image}" alt="${h.name}" class="hotel-image w-full h-full object-cover" loading="lazy">
                    ${discount > 0 ? `<div class="absolute top-3 left-3 bg-[var(--error)] text-white text-xs font-bold px-2 py-1 rounded">${discount}% OFF</div>` : ''}
                    <div class="absolute top-3 right-3 rating-badge"><i data-lucide="star" class="w-3 h-3"></i> ${h.rating.toFixed(1)}</div>
                </div>
                <div class="p-4">
                    <h3 class="font-display font-semibold text-lg mb-1 truncate">${h.name}</h3>
                    <div class="flex items-center gap-1 text-[var(--fg-muted)] text-sm mb-3">
                        <i data-lucide="map-pin" class="w-3 h-3"></i> <span class="truncate">${h.location}</span>
                    </div>
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${h.amenities.slice(0, 3).map(a => `<span class="amenity-pill"><i data-lucide="${getAmenityIcon(a)}" class="w-3 h-3"></i> ${a}</span>`).join('')}
                        ${h.amenities.length > 3 ? `<span class="amenity-pill">+${h.amenities.length - 3}</span>` : ''}
                    </div>
                    <div class="flex items-end justify-between">
                        <div>
                            <span class="text-[var(--fg-muted)] text-sm line-through">₹${formatPrice(h.origPrice)}</span>
                            <div class="font-display text-2xl font-bold text-[var(--accent)]">₹${formatPrice(h.price)}</div>
                        </div>
                        <span class="text-xs text-[var(--fg-muted)]">${h.ratingCount} reviews</span>
                    </div>
                </div>
            </article>
        `}).join('');
        
        lucide.createIcons();
    }

    function openHotelModal(id) {
        const h = (DB.get('gt_hotels') || []).find(x => x.id === id);
        if (!h) return;
        
        const reviews = (DB.get('gt_reviews') || []).filter(r => r.hotelId === id);
        
        $('modalBody').innerHTML = `
            <div class="relative h-64">
                <img src="${h.image}" alt="${h.name}" class="w-full h-full object-cover">
                <button onclick="closeModal('hotelModal')" class="absolute top-4 left-4 bg-[var(--bg)] bg-opacity-80 p-2 rounded-full hover:bg-opacity-100 transition-all border-none cursor-pointer">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-4">
                <div class="flex items-start justify-between mb-2">
                    <h2 class="font-display text-2xl font-bold">${h.name}</h2>
                    <div class="rating-badge"><i data-lucide="star" class="w-3 h-3"></i> ${h.rating.toFixed(1)}</div>
                </div>
                <div class="flex items-center gap-1 text-[var(--fg-muted)] mb-4">
                    <i data-lucide="map-pin" class="w-4 h-4"></i> ${h.location}
                </div>
                <p class="text-[var(--fg-muted)] mb-6">${h.desc}</p>
                
                <h3 class="font-display font-semibold mb-3">Amenities</h3>
                <div class="grid grid-cols-2 gap-2 mb-6">
                    ${h.amenities.map(a => `<div class="flex items-center gap-2 p-2 bg-[var(--bg)] rounded-lg"><i data-lucide="${getAmenityIcon(a)}" class="w-4 h-4 text-[var(--accent)]"></i><span class="text-sm">${a}</span></div>`).join('')}
                </div>
                
                <h3 class="font-display font-semibold mb-3">Policies</h3>
                <ul class="space-y-2 mb-6">
                    ${h.policies.map(p => `<li class="flex items-start gap-2 text-sm text-[var(--fg-muted)]"><i data-lucide="check" class="w-4 h-4 text-[var(--success)] mt-0.5 flex-shrink-0"></i>${p}</li>`).join('')}
                </ul>
                
                <h3 class="font-display font-semibold mb-3">Location</h3>
                <div class="rounded-xl overflow-hidden mb-6 border border-[var(--border)]">
                    <iframe width="100%" height="200" style="border:0" loading="lazy" src="https://www.google.com/maps/embed/v1/view?key=AIzaSyBFw0Qbyq9zTFTd-tUY6dZWTgaQzuU17R8&center=${h.lat},${h.lng}&zoom=14"></iframe>
                </div>
                
                <h3 class="font-display font-semibold mb-3">Reviews (${h.ratingCount})</h3>
                <div class="space-y-3 mb-6">
                    ${reviews.slice(0, 3).map(r => `
                        <div class="bg-[var(--bg)] rounded-lg p-3">
                            <div class="flex justify-between mb-1">
                                <span class="font-semibold text-sm">${r.userName}</span>
                                <span class="text-xs text-[var(--fg-muted)]">${r.rating}/5</span>
                            </div>
                            <p class="text-sm text-[var(--fg-muted)]">${r.comment}</p>
                        </div>
                    `).join('') || '<p class="text-[var(--fg-muted)]">No reviews yet.</p>'}
                </div>
                
                <form onsubmit="submitReview(event, '${id}')" class="space-y-3 border-t border-[var(--border)] pt-4">
                    <input type="hidden" id="revHotelId" value="${id}">
                    <div class="grid grid-cols-4 gap-3">
                        <select id="revRating" class="input-field" required><option value="5">5★</option><option value="4">4★</option><option value="3">3★</option><option value="2">2★</option><option value="1">1★</option></select>
                        <input type="text" id="revName" class="input-field col-span-3" placeholder="Your Name" value="${state.user?.name || ''}" required>
                    </div>
                    <textarea id="revComment" class="input-field" placeholder="Write your review..." required></textarea>
                    <button type="submit" class="btn-secondary w-full text-sm py-2">Submit Review</button>
                </form>
            </div>
            
            <div class="sticky bottom-0 bg-[var(--bg-elevated)] border-t border-[var(--border)] p-4 flex items-center justify-between">
                <div>
                    <div class="text-sm text-[var(--fg-muted)] line-through">₹${formatPrice(h.origPrice)}</div>
                    <div class="font-display text-2xl font-bold text-[var(--accent)]">₹${formatPrice(h.price)} <span class="text-xs font-normal text-[var(--fg-muted)]">+ taxes</span></div>
                </div>
                <button onclick="openBookingModal('${h.id}')" class="btn-primary"><i data-lucide="calendar-check" class="w-4 h-4"></i> Book Now</button>
            </div>
        `;
        
        $('hotelModal').classList.add('active');
        document.body.style.overflow = 'hidden';
        lucide.createIcons();
    }

    function openBookingModal(id) {
        const h = (DB.get('gt_hotels') || []).find(x => x.id === id);
        if (!h) return;
        
        const checkIn = $('checkIn').value;
        const checkOut = $('checkOut').value;
        const nights = Math.ceil((new Date(checkOut) - new Date(checkIn)) / (1000 * 60 * 60 * 24)) || 1;
        
        $('bHotelId').value = id;
        $('bGuestName').value = state.user?.name || '';
        $('bDates').textContent = `${new Date(checkIn).toLocaleDateString()} - ${new Date(checkOut).toLocaleDateString()}`;
        $('bPrice').textContent = '₹' + formatPrice(h.price * nights);
        $('bTotalPrice').value = h.price * nights;
        
        closeModal('hotelModal');
        setTimeout(() => {
            $('bookingModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }, 300);
    }

    function closeModal(id) {
        $(id).classList.remove('active');
        document.body.style.overflow = '';
    }

    // ==========================================
    // LOGIC / HANDLERS
    // ==========================================

    function performSearch() {
        const query = $('searchLocation').value.toLowerCase().trim();
        renderHotels(query);
    }

    function handleLogin(e) {
        e.preventDefault();
        const user = $('loginUser').value;
        const pass = $('loginPass').value;
        
        // Hardcoded Admin
        if (user === 'admin' && pass === 'admin') {
            state.user = { id: 'admin', name: 'Administrator', role: 'admin' };
            DB.set('gt_session', state.user);
            showToast('Welcome Admin');
            navigateTo('home');
            return;
        }
        
        // Check DB users
        const users = DB.get('gt_users') || [];
        const found = users.find(u => u.username === user && u.password === pass);
        
        if (found) {
            state.user = found;
            DB.set('gt_session', state.user);
            showToast('Login Successful');
            navigateTo('home');
        } else {
            showToast('Invalid credentials', 'error');
        }
    }

    function handleRegister(e) {
        e.preventDefault();
        const name = $('regName').value;
        const user = $('regUser').value;
        const pass = $('regPass').value;
        
        const users = DB.get('gt_users') || [];
        if (users.find(u => u.username === user)) {
            showToast('Username exists', 'error');
            return;
        }
        
        const newUser = { id: generateId(), name, username: user, password: pass, role: 'user' };
        users.push(newUser);
        DB.set('gt_users', users);
        
        showToast('Registration successful! Please login.');
        renderAccount('login');
    }

    function logout() {
        state.user = null;
        DB.set('gt_session', null);
        showToast('Logged out');
        navigateTo('home');
    }

    function handleBooking(e) {
        e.preventDefault();
        const booking = {
            id: generateId(),
            orderId: 'JG-' + Math.floor(Math.random() * 90000 + 10000),
            hotelId: $('bHotelId').value,
            guestName: $('bGuestName').value,
            guestPhone: $('bGuestPhone').value,
            checkIn: $('checkIn').value,
            checkOut: $('checkOut').value,
            totalPrice: $('bTotalPrice').value,
            status: 'Confirmed',
            userId: state.user?.id || 'guest'
        };
        
        const bookings = DB.get('gt_bookings') || [];
        bookings.push(booking);
        DB.set('gt_bookings', bookings);
        
        $('successOrderId').textContent = booking.orderId;
        closeModal('bookingModal');
        navigateTo('success');
    }

    function submitReview(e, hotelId) {
        e.preventDefault();
        const review = {
            id: generateId(),
            hotelId: hotelId,
            userName: $('revName').value,
            rating: parseInt($('revRating').value),
            comment: $('revComment').value
        };
        
        const reviews = DB.get('gt_reviews') || [];
        reviews.push(review);
        DB.set('gt_reviews', reviews);
        
        // Update Hotel Rating
        const hotels = DB.get('gt_hotels') || [];
        const hotelReviews = reviews.filter(r => r.hotelId === hotelId);
        const avgRating = hotelReviews.reduce((acc, r) => acc + r.rating, 0) / hotelReviews.length;
        
        const hotelIndex = hotels.findIndex(h => h.id === hotelId);
        if (hotelIndex !== -1) {
            hotels[hotelIndex].rating = parseFloat(avgRating.toFixed(1));
            hotels[hotelIndex].ratingCount = hotelReviews.length;
            DB.set('gt_hotels', hotels);
        }
        
        showToast('Review Submitted!');
        closeModal('hotelModal');
    }

    function handleAddHotel(e) {
        e.preventDefault();
        const amenities = [];
        document.querySelectorAll('#amenCheckboxes input:checked').forEach(el => amenities.push(el.value));
        
        const hotel = {
            id: generateId(),
            name: $('addName').value,
            location: $('addLocation').value,
            desc: $('addDesc').value,
            price: parseFloat($('addPrice').value),
            origPrice: parseFloat($('addOrigPrice').value),
            image: $('addImage').value,
            amenities: amenities,
            policies: $('addPolicies').value.split('\n').filter(p => p.trim()),
            lat: $('addLat').value,
            lng: $('addLng').value,
            rating: 0,
            ratingCount: 0
        };
        
        const hotels = DB.get('gt_hotels') || [];
        hotels.push(hotel);
        DB.set('gt_hotels', hotels);
        
        showToast('Hotel Added!');
        e.target.reset();
        renderAdmin();
    }

    // ==========================================
    // PAGE RENDERERS
    // ==========================================

    function renderBookings() {
        const container = $('bookingsContent');
        if (!state.user) {
            container.innerHTML = `
                <div class="text-center py-16">
                    <i data-lucide="lock" class="w-16 h-16 text-[var(--fg-muted)] mx-auto mb-4"></i>

                    <p class="text-[var(--fg-muted)] mb-6">Login to view your booking history</p>
                    <button onclick="navigateTo('account')" class="btn-primary"><i data-lucide="log-in" class="w-4 h-4"></i> Login</button>
                </div>`;
            return;
        }

        const bookings = (DB.get('gt_bookings') || []).filter(b => b.userId === state.user.id).reverse();
        
        if (bookings.length === 0) {
            container.innerHTML = `
                <div class="text-center py-16">
                    <i data-lucide="calendar-x" class="w-16 h-16 text-[var(--fg-muted)] mx-auto mb-4"></i>

                </div>`;

            const hotel = hotels.find(h => h.id === b.hotelId) || { name: 'Unknown', image: '' };
            return `
                <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 flex gap-4 animate-slide-up">

                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-mono bg-[var(--bg)] px-2 py-1 rounded">${b.orderId}</span>
                            <span class="status-confirmed">${b.status}</span>
                        </div>
                        <div class="font-display font-bold text-[var(--accent)]">₹${formatPrice(b.totalPrice)}</div>
                    </div>
                </div>`;
        }).join('')}</div>`;

        if (state.user) {
            container.innerHTML = `
                <div class="text-center mb-8 animate-fade-in">
                    <div class="w-24 h-24 bg-[var(--accent)] rounded-full flex items-center justify-center mx-auto mb-4">
                        <span class="text-4xl font-display font-bold text-[var(--bg)]">${state.user.name.charAt(0)}</span>

                </div>
                ${state.user.role === 'admin' ? `<button onclick="navigateTo('admin')" class="btn-primary w-full mb-4"><i data-lucide="shield" class="w-4 h-4"></i> Open Admin Panel</button>` : ''}

            `;
        } else {

                    <input type="password" id="loginPass" class="input-field" placeholder="Password" required>
                    <button type="submit" class="btn-primary w-full"><i data-lucide="log-in" class="w-4 h-4"></i> Login</button>

                <p class="text-center text-sm text-[var(--fg-muted)] mt-4">Don't have an account? <button onclick="renderAccount('register')" class="text-[var(--accent)] bg-transparent border-none cursor-pointer">Sign up</button></p>

    // Helper for Admin Login Demo

        $('loginUser').value = 'admin';
        $('loginPass').value = 'admin';
    }

    function toggleAdminTab(tab) {
        if (tab === 'add') {
            $('adminAddTab').classList.remove('hidden');
            $('adminListTab').classList.add('hidden');
            $('tabAddBtn').className = 'btn-primary flex-shrink-0';
            $('tabListBtn').className = 'btn-secondary flex-shrink-0';
        } else {
            $('adminListTab').classList.remove('hidden');
            $('adminAddTab').classList.add('hidden');
            $('tabListBtn').className = 'btn-primary flex-shrink-0';
            $('tabAddBtn').className = 'btn-secondary flex-shrink-0';
        }
    }

    // ==========================================
    // INITIALIZATION
    // ==========================================
    
    // Set Dates
    window.onload = function() {
        lucide.createIcons();
        
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        
        $('checkIn').value = today.toISOString().split('T')[0];
        $('checkOut').value = tomorrow.toISOString().split('T')[0];
        
        // Restore session
        const session = DB.get('gt_session');
        if (session) {
            state.user = session;
            $('headerUserName').textContent = state.user.name;
        }
        
        renderHotels();
    };

    // Form listeners
    $('bookingForm').addEventListener('submit', handleBooking);

    // Modal close on escape
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            closeModal('hotelModal');
            closeModal('bookingModal');
        }
    });

    // Click outside modal to close
    $('hotelModal').addEventListener('click', (e) => { if(e.target === $('hotelModal')) closeModal('hotelModal'); });
    $('bookingModal').addEventListener('click', (e) => { if(e.target === $('bookingModal')) closeModal('bookingModal'); });

</script>
</body>
</html>
